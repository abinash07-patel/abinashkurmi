
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avinash | Private Gallery</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #080d1c, #182449, #351a45);
}

/* Floating bubbles */
#bubbles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.bubble {
  position: absolute;
  bottom: -80px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    rgba(255,255,255,.6),
    rgba(120,160,255,.12),
    transparent 75%
  );
  box-shadow: inset -5px -5px 15px #a6c8ff20;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  15% { opacity: .8; }
  85% { opacity: .6; }
  100% {
    transform: translateY(-120vh) translateX(70px);
    opacity: 0;
  }
}

/* Login card */
.login-box {
  position: relative;
  z-index: 2;
  width: min(390px, 90%);
  padding: 35px;
  border-radius: 25px;
  border: 1px solid #ffffff35;
  background: #ffffff12;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 70px #0006;
}

.logo {
  width: 55px;
  height: 55px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  color: #10152e;
  background: linear-gradient(135deg, #a9c1ff, #e5b4ff);
  font-size: 28px;
}

.tag {
  margin-top: 24px;
  color: #b8c7ff;
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin-top: 10px;
  font-size: 34px;
}

.description {
  margin: 13px 0 26px;
  color: #c2c9dd;
  font-size: 14px;
  line-height: 1.6;
}

label {
  display: block;
  margin-bottom: 10px;
  font-size: 12px;
  letter-spacing: 1px;
}

.input-area {
  display: flex;
  align-items: center;
  padding: 0 12px;
  border: 1px solid #ffffff30;
  border-radius: 13px;
  background: #05091970;
}

.input-area:focus-within {
  border-color: #b8c7ff;
  box-shadow: 0 0 0 3px #a5b7ff20;
}

input {
  width: 100%;
  padding: 15px 5px;
  border: none;
  outline: none;
  color: white;
  background: transparent;
  font-size: 16px;
  letter-spacing: 3px;
}

input::placeholder {
  color: #8992ad;
  letter-spacing: 1px;
}

.eye {
  border: none;
  background: none;
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.error {
  min-height: 27px;
  padding-top: 8px;
  color: #ff9eae;
  font-size: 12px;
}

button.unlock {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  color: #15172b;
  background: linear-gradient(100deg, #b8c7ff, #e4b7ff);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .25s;
}

button.unlock:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px #b5a3ff35;
}

.footer {
  margin-top: 22px;
  text-align: center;
  color: #8e99b8;
  font-size: 10px;
  letter-spacing: 1px;
}

/* Photo popup */
#photoScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  padding: 25px;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  background: #070a17ed;
  backdrop-filter: blur(18px);
}

#photoScreen img {
  max-width: 90vw;
  max-height: 75vh;
  margin-top: 20px;
  object-fit: contain;
  border-radius: 20px;
  border: 1px solid #ffffff50;
  box-shadow: 0 20px 70px #0009;
  animation: reveal .7s ease;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.close {
  position: fixed;
  top: 20px;
  right: 25px;
  border: 1px solid #ffffff40;
  border-radius: 50%;
  padding: 8px 14px;
  color: white;
  background: #ffffff15;
  font-size: 25px;
  cursor: pointer;
}

@media(max-width: 450px) {
  .login-box { padding: 27px 23px; }
  h1 { font-size: 30px; }
}
</style>
</head>

<body>

<div id="bubbles"></div>

<div class="login-box" id="loginBox">
  <div class="logo">✦</div>

  <p class="tag">PERSONAL SPACE</p>
  <h1>Welcome back.</h1>

  <p class="description">
    A little corner of the internet, just for you.
    Enter your password to reveal your photo.
  </p>

  <form id="loginForm">
    <label for="password">ACCESS PASSWORD</label>

    <div class="input-area">
      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >
      <button class="eye" type="button" id="toggle">◉</button>
    </div>

    <p class="error" id="error"></p>

    <button class="unlock" type="submit">
      Unlock my photo ↗
    </button>
  </form>

  <p class="footer">✧ PRIVATE GALLERY · MADE FOR YOU</p>
</div>

<!-- Your photo appears after successful login -->
<div id="photoScreen">
  <button class="close" id="closePhoto">×</button>
  <h2>Your Moment ✨</h2>

  <!-- Put your photo in the same folder as this HTML file -->
  <img src="my-photo.jpg" alt="Avinash's Photo">

  <p style="margin-top:15px;color:#c2c9dd">
    Some moments deserve their own space.
  </p>
</div>

<script>
// Create floating bubbles
const bubbles = document.getElementById("bubbles");

for (let i = 0; i < 35; i++) {
  const bubble = document.createElement("span");
  bubble.className = "bubble";

  const size = Math.random() * 45 + 12;

  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.left = Math.random() * 100 + "%";
  bubble.style.animationDuration =
    (Math.random() * 15 + 10) + "s";
  bubble.style.animationDelay =
    (-Math.random() * 20) + "s";

  bubbles.appendChild(bubble);
}

// Show or hide password
document.getElementById("toggle").onclick = function () {
  const input = document.getElementById("password");

  input.type = input.type === "password"
    ? "text"
    : "password";
};

// Login functionality
document.getElementById("loginForm").onsubmit = function (event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (password === "12345") {
    error.textContent = "";
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("photoScreen").style.display = "flex";
  } else {
    error.textContent = "Incorrect password. Try again!";
    document.getElementById("password").value = "";
  }
};

// Close photo and return to login
document.getElementById("closePhoto").onclick = function () {
  document.getElementById("photoScreen").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("password").value = "";
};

// Escape key closes the photo
document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    document.getElementById("photoScreen").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("password").value = "";
  }
});
</script>

</body>
</html>
